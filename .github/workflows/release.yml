name: Publish release

on:
  push:
    branches: [main]
    paths: [version.properties]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: our-music-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OUR_MUSIC_STORE_FILE: ${{ github.workspace }}/release.jks
      OUR_MUSIC_STORE_PASSWORD: ${{ secrets.OUR_MUSIC_STORE_PASSWORD }}
      OUR_MUSIC_KEY_ALIAS: ${{ secrets.OUR_MUSIC_KEY_ALIAS }}
      OUR_MUSIC_KEY_PASSWORD: ${{ secrets.OUR_MUSIC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - name: Restore release signing key
        env:
          OUR_MUSIC_KEYSTORE_BASE64: ${{ secrets.OUR_MUSIC_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('OUR_MUSIC_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Release signing secrets have not been configured')
          Path(os.environ['OUR_MUSIC_STORE_FILE']).write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Publish APK and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          tag="v$version"
          cp app/build/outputs/apk/release/app-release.apk OurMusic.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Our Music $version" --notes-file CHANGELOG.md
          fi
          mkdir -p published
          if gh release download "$tag" --pattern OurMusic.apk --dir published >/dev/null 2>&1; then
            cp published/OurMusic.apk OurMusic.apk
          else
            gh release upload "$tag" OurMusic.apk
          fi
          python scripts/create_update_manifest.py OurMusic.apk
          gh release upload "$tag" update.json --clobber
      - name: Publish update manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m 'Publish release manifest' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove signing key
        if: always()
        run: rm -f "$OUR_MUSIC_STORE_FILE"
