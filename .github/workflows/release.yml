name: Publish release

on:
  push:
    branches: [main]
    paths: [version.properties]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: our-music-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      OUR_MUSIC_STORE_FILE: ${{ github.workspace }}/release.jks
      OUR_MUSIC_STORE_PASSWORD: ${{ secrets.OUR_MUSIC_STORE_PASSWORD }}
      OUR_MUSIC_KEY_ALIAS: ${{ secrets.OUR_MUSIC_KEY_ALIAS }}
      OUR_MUSIC_KEY_PASSWORD: ${{ secrets.OUR_MUSIC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android command line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - name: Restore release signing key
        env:
          OUR_MUSIC_KEYSTORE_BASE64: ${{ secrets.OUR_MUSIC_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('OUR_MUSIC_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Release signing secrets have not been configured')
          Path(os.environ['OUR_MUSIC_STORE_FILE']).write_bytes(base64.b64decode(value, validate=True))
          PY
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Publish APK and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')
          tag="v$version"
          cp app/build/outputs/apk/release/app-release.apk OurMusic.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Our Music $version" --notes-file CHANGELOG.md
          fi
          mkdir -p published
          if gh release download "$tag" --pattern OurMusic.apk --dir published >/dev/null 2>&1; then
            cp published/OurMusic.apk OurMusic.apk
          else
            gh release upload "$tag" OurMusic.apk
          fi
          python scripts/create_update_manifest.py OurMusic.apk
          gh release upload "$tag" update.json --clobber
      - name: Publish update manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          candidate_manifest="$RUNNER_TEMP/our-music-update.json"
          cp update.json "$candidate_manifest"
          git restore update.json
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach origin/main
            if ! python - "$candidate_manifest" <<'PY'
          import json, sys
          from pathlib import Path
          candidate = json.loads(Path(sys.argv[1]).read_text())
          properties = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          matches = int(properties['VERSION_CODE']) == candidate['versionCode'] and properties['VERSION_NAME'] == candidate['versionName']
          if not matches:
              print('Source version has changed; keeping the current update manifest.')
          raise SystemExit(0 if matches else 1)
          PY
            then
              exit 0
            fi
            cp "$candidate_manifest" update.json
            git add update.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish release manifest'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'The update manifest could not be published after three attempts.'
          exit 1
      - name: Remove signing key
        if: always()
        run: rm -f "$OUR_MUSIC_STORE_FILE"
